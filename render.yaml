# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in the Render Dashboard and choose
# "Deploy Blueprint" - Render detects this file automatically. Any
# envVar below marked `sync: false` needs a real value entered manually
# in the Render Dashboard after the Blueprint creates the service -
# these are secrets/environment-specific values that deliberately never
# get committed to source control, even as placeholders.
services:
  - type: web
    name: ai-codebase-assistant-api
    runtime: docker
    # This project is an npm workspaces monorepo - the Dockerfile lives
    # under apps/api/, but its build steps (COPY package.json,
    # package-lock.json, etc.) expect the REPO ROOT as build context, not
    # the apps/api/ directory itself, to resolve the full workspace
    # dependency tree correctly.
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    # Render's own health-check docs explicitly recommend checking
    # operation-critical dependencies (their example: "executing a
    # simple database query to confirm connectivity") - unlike a bare
    # Kubernetes liveness probe, Render's healthCheckPath serves BOTH
    # zero-downtime-deploy cutover AND ongoing failure detection for a
    # running instance, with its own built-in grace periods (15s before
    # pausing traffic to a failing instance, 60s before restarting it).
    # /health/ready is the right choice here, trusting those grace
    # periods to already absorb a momentary Mongo blip rather than
    # second-guessing Render's own platform design by using the
    # liveness-only endpoint instead.
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false # your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a secure random value - no need to create one yourself
      - key: JWT_ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_REFRESH_TOKEN_TTL
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: '12'
      - key: LOCAL_EMBEDDING_MODEL
        value: onnx-community/all-MiniLM-L6-v2-ONNX
      - key: GROQ_API_KEY
        sync: false # free key from console.groq.com
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MAX_TOKENS
        value: '1024'
      - key: CHAT_RETRIEVAL_TOP_K
        value: '8'
      - key: RATE_LIMIT_AUTH_MAX
        value: '5'
      - key: RATE_LIMIT_IMPORT_MAX
        value: '10'
      - key: RATE_LIMIT_CHAT_MAX
        value: '30'
      - key: ALLOWED_ORIGINS
        sync: false # set to the real, deployed web service's own URL (see ai-codebase-assistant-web below) once you know it - comma-separated for more than one origin
      # Deliberately conservative (not the 3000 default suitable for a
      # normally-resourced deployment) - Render's free tier caps memory
      # at 512MB, and a real live deployment confirmed via a confirmed
      # OOM crash (SIGKILL, exit code 137) that a 40-file repository
      # exceeds that ceiling during embedding, while a ~5-file repo
      # works cleanly. 15 gives real safety margin without needing to
      # pinpoint the exact crash threshold. Raise this back up if this
      # service is ever upgraded to a plan with more than 512MB RAM.
      - key: MAX_REPO_FILES
        value: '15'
      - key: MAX_FILE_SIZE_KB
        value: '500'
      - key: GITHUB_TOKEN
        sync: false # optional but recommended - raises the GitHub API rate limit from 60/hr to 5000/hr

  - type: web
    name: ai-codebase-assistant-web
    runtime: static
    # This project is an npm workspaces monorepo, same reasoning as the
    # API service above - the build must run from the repo root to
    # resolve the full workspace dependency tree, then build only
    # apps/web specifically (an existing, already-defined root script).
    # --ignore-scripts is a real, verified fix, not just a speed
    # optimization: a bare `npm install` in this workspaces monorepo
    # installs ALL workspaces' dependencies together (a single, shared
    # lockfile - there's no way to install just apps/web's own deps),
    # including apps/api's heavy native ones (bcrypt, sharp,
    # onnxruntime-node) that this static site never imports or needs at
    # all - confirmed directly, zero references anywhere in apps/web's
    # own source. Their postinstall scripts do real, unnecessary native
    # compilation and external downloads (onnxruntime-node's alone
    # reaches out to api.nuget.org) that a pure `tsc -b && vite build`
    # has no reason to depend on succeeding.
    buildCommand: npm install --ignore-scripts && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      # VITE_API_BASE_URL must be the REAL, deployed API service's own
      # URL (e.g. https://ai-codebase-assistant-api.onrender.com - find
      # this on the API service's own page in the Render Dashboard,
      # copied exactly, including the https:// prefix and no trailing
      # slash). Set manually rather than via a fromService reference:
      # Render's own documented examples show inconsistent output
      # formats for the `host` property across different real-world
      # blueprints (some already include the full onrender.com domain,
      # some don't) - a manual value copied directly from the real,
      # deployed service is the one guaranteed-correct source here,
      # matching the same sync: false pattern already proven for every
      # other manually-entered value in this file.
      - key: VITE_API_BASE_URL
        sync: false # the API service's own real URL, copied from its Render Dashboard page
    # A single-page app - without this rewrite rule, visiting a real,
    # deep link like /workspace/abc123 directly (not by client-side
    # navigation from / first) would 404, since no literal file exists
    # at that path. This rewrites every path to index.html, letting
    # react-router-dom's own client-side routing take over from there,
    # exactly the way it already does for a fresh page load at / itself.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
